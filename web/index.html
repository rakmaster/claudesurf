<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<style>
  :root {
    --bg: var(--openidea-bg, #1e1f22);
    --bg2: var(--openidea-bg-elevated, #2b2d30);
    --hover: var(--openidea-bg-hover, rgba(127,127,127,.12));
    --input: var(--openidea-bg-input, transparent);
    --fg: var(--openidea-fg, #dfe1e5);
    --strong: var(--openidea-fg-strong, var(--fg));
    --muted: var(--openidea-fg-muted, #868a91);
    --border: var(--openidea-border, rgba(127,127,127,.3));
    --accent: var(--openidea-accent, #d97757);
    --on-accent: var(--openidea-fg-on-accent, #fff);
    --link: var(--openidea-link, #589df6);
    --danger: var(--openidea-danger, #e5534b);
    --warning: var(--openidea-warning, #d29922);
    --success: var(--openidea-success, #57ab5a);
    --mono: var(--openidea-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    --ui: var(--openidea-font-ui, system-ui, -apple-system, sans-serif);
    --size: var(--openidea-font-size, 13px);
    --claude: #d97757;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    font: var(--size)/1.5 var(--ui); color: var(--fg); background: transparent;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  .top { display: flex; align-items: center; gap: 6px; padding: 4px 8px; padding-right: calc(8px + var(--openidea-corner-inset-width, 0px)); border-bottom: 1px solid var(--border); min-height: var(--openidea-corner-inset-height, 34px); }
  .top .title { font-weight: 600; color: var(--strong); display: flex; align-items: center; gap: 6px; }
  .top .spacer { flex: 1; }
  .icon-btn { background: none; border: 0; padding: 3px 6px; border-radius: 4px; cursor: pointer; color: var(--muted); }
  .icon-btn:hover, .icon-btn.on { background: var(--hover); color: var(--fg); }
  .img-btn { display: grid; place-items: center; padding: 3px 5px; }
  .ico-img { vertical-align: -2px; }
  .spark { width: 14px; height: 14px; color: var(--claude); }

  /* Messages */
  #log { flex: 1; overflow-y: auto; padding: 10px 10px 4px; scroll-behavior: auto; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; padding: 0 16px; }
  .empty .spark { width: 30px; height: 30px; }
  .empty h2 { color: var(--strong); font-size: 1.15em; margin: 8px 0 4px; }
  .suggest { display: flex; flex-direction: column; gap: 6px; margin: 14px auto 0; max-width: 320px; }
  .suggest button { text-align: left; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .suggest button:hover { border-color: var(--accent); }

  .msg { margin: 0 0 12px; }
  .msg.user { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; word-wrap: break-word; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font: 0.85em var(--mono); color: var(--muted); background: var(--hover); border-radius: 4px; padding: 0 6px; margin-bottom: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.assistant { word-wrap: break-word; }
  .msg.assistant > :first-child { margin-top: 0; }
  .msg.assistant > :last-child { margin-bottom: 0; }
  .msg.assistant p { margin: 0 0 8px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { color: var(--strong); margin: 12px 0 6px; font-size: 1.05em; }
  .msg.assistant h1 { font-size: 1.2em; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 8px; padding-left: 20px; }
  .msg.assistant blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .msg.assistant a { color: var(--link); }
  .msg.assistant hr { border: 0; border-top: 1px solid var(--border); }
  .msg.assistant table { border-collapse: collapse; margin: 0 0 8px; font-size: .95em; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 2px 6px; }
  code { font-family: var(--mono); font-size: .92em; background: var(--hover); padding: 0 4px; border-radius: 3px; }
  .file-link { color: var(--link); cursor: pointer; }
  .file-link:hover { text-decoration: underline; }
  .code { position: relative; margin: 0 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg2); }
  .code .bar { display: flex; justify-content: space-between; align-items: center; padding: 1px 4px 1px 8px; font-size: .8em; color: var(--muted); border-bottom: 1px solid var(--border); }
  .code pre { margin: 0; padding: 8px; overflow-x: auto; font: .92em/1.45 var(--mono); }
  .code pre code { background: none; padding: 0; }
  .cursor::after { content: "▍"; color: var(--claude); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Tool cards */
  .tool { margin: 0 0 6px; border: 1px solid var(--border); border-radius: 6px; font-size: .92em; }
  .tool.sub { margin-left: 14px; opacity: .85; }
  .tool summary { list-style: none; display: flex; gap: 6px; align-items: center; padding: 3px 8px; cursor: pointer; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary:hover { background: var(--hover); }
  .tool .name { font-weight: 600; color: var(--strong); flex: none; }
  .tool .ttl { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool .st { flex: none; width: 14px; text-align: center; }
  .tool .st.run { color: var(--muted); animation: spin 1s linear infinite; }
  .tool .st.ok { color: var(--success); }
  .tool .st.err { color: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool pre { margin: 0; padding: 6px 8px; border-top: 1px solid var(--border); max-height: 260px; overflow: auto; font: .9em/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .tool pre .add { color: var(--success); }
  .tool pre .del { color: var(--danger); }

  /* Permission prompts */
  .perm { margin: 0 0 10px; border: 1px solid var(--warning); border-radius: 6px; padding: 6px 8px; background: var(--bg2); }
  .perm .head { display: flex; gap: 6px; align-items: baseline; }
  .perm .head b { color: var(--strong); }
  .perm .ttl { font-family: var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .perm .why { font-size: .9em; color: var(--muted); margin-top: 2px; }
  .perm pre { margin: 6px 0 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; max-height: 200px; overflow: auto; font: .9em/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .perm pre .add { color: var(--success); }
  .perm pre .del { color: var(--danger); }
  .perm .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .perm .btns button { border: 1px solid var(--border); border-radius: 5px; padding: 2px 10px; cursor: pointer; background: none; }
  .perm .btns button:hover { border-color: var(--accent); }
  .perm .btns .allow { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .perm .btns .deny:hover { border-color: var(--danger); color: var(--danger); }
  .perm .btns button:disabled { opacity: .5; cursor: default; }
  .perm.answered { border-color: var(--border); padding: 3px 8px; }
  .perm.answered .why, .perm.answered pre, .perm.answered .btns { display: none; }
  .perm .res { flex: none; font-size: .9em; }
  /* AskUserQuestion */
  .perm.ask { border-color: var(--accent); }
  .ask .q { margin-top: 8px; }
  .ask .qtext { color: var(--strong); }
  .ask .tag { font-size: .8em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .ask .opts { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .ask .opt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: none; border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  .ask .opt:hover { border-color: var(--accent); }
  .ask .opt.on { border-color: var(--accent); background: var(--hover); }
  .ask .opt.on .lbl::before { content: "✓ "; color: var(--accent); }
  .ask .opt .desc { font-size: .88em; color: var(--muted); }
  .ask .other { width: 100%; margin-top: 4px; font: inherit; color: var(--fg); background: var(--input); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; }
  .ask .qa { font-size: .9em; margin-top: 2px; }
  .ask .qa .qq { color: var(--muted); }
  .perm.answered .q { display: none; }
  .perm .res.ok { color: var(--success); }
  .perm .res.no { color: var(--danger); }

  .note { font-size: .88em; color: var(--muted); margin: 0 0 12px; }
  .note.error { color: var(--danger); white-space: pre-wrap; }
  .note.warn { color: var(--warning); }
  .note button { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; cursor: pointer; margin-left: 4px; color: var(--fg); }
  .status { font-size: .88em; color: var(--muted); padding: 0 12px 4px; min-height: 1.5em; display: flex; align-items: center; gap: 6px; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* Composer */
  .composer { position: relative; margin: 0 8px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--input); }
  /* @ picker */
  .mentions { position: absolute; left: -1px; right: -1px; bottom: calc(100% + 4px); max-height: 260px; overflow-y: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.25); padding: 3px; z-index: 5; }
  .mentions .item { display: flex; align-items: baseline; gap: 6px; padding: 2px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .mentions .item.on { background: var(--hover); outline: 1px solid var(--accent); }
  .mentions .ico { flex: none; width: 1.2em; text-align: center; color: var(--muted); }
  .mentions .nm { color: var(--strong); flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
  .mentions .dt { color: var(--muted); font-size: .88em; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; min-width: 0; }
  .mentions .none { color: var(--muted); padding: 2px 6px; }
  .chip.at { color: var(--link); margin-right: 4px; }
  /* Queued messages */
  .queue { padding: 6px 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .queue[hidden] { display: none; }
  .queue .qhead { font-size: .8em; color: var(--muted); }
  .queue .qi { display: flex; align-items: center; gap: 6px; border: 1px dashed var(--border); border-radius: 5px; padding: 2px 4px 2px 8px; background: var(--bg2); }
  .queue .qi .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .queue .qi .qt:hover { text-decoration: underline; }
  .queue .qi .qn { flex: none; font-size: .8em; color: var(--muted); }
  .queue .qi button { flex: none; background: none; border: 1px solid transparent; border-radius: 4px; padding: 0 5px; cursor: pointer; color: var(--muted); font-size: .85em; }
  .queue .qi button:hover { border-color: var(--border); color: var(--fg); }
  .queue .qi .now { color: var(--accent); }
  body.busy .queue .qi .now { display: none; }

  /* Images */
  .imgrow { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 10px 0; }
  .imgrow[hidden] { display: none; }
  .imgrow .im { position: relative; width: 56px; height: 56px; flex: none; }
  .imgrow .im img { width: 100%; height: 100%; object-fit: cover; display: block; border: 1px solid var(--border); border-radius: 5px; background: var(--bg2); }
  .imgrow .im .rm {
    position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; padding: 0;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    font-size: 12px; line-height: 1; font-weight: 700;
    background: var(--bg2); color: var(--fg); border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .imgrow .im .rm:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
  .imgrow .im.busy { opacity: .5; }
  .composer.drop { border-color: var(--accent); border-style: dashed; }
  .msg.user .thumbs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
  .msg.user .thumbs img { max-width: 120px; max-height: 90px; border-radius: 4px; border: 1px solid var(--border); display: block; }
  .msg.user .thumbs .gone { font: .85em var(--mono); color: var(--muted); }
  /* Checkpoints */
  .msg.user { position: relative; }
  .msg.user .revert { position: absolute; top: 2px; right: 4px; visibility: hidden; font-size: .85em; padding: 0 6px; background: var(--bg2); }
  .msg.user:hover .revert { visibility: visible; }
  body.busy .msg.user .revert { display: none; }
  .perm.rewind { border-color: var(--danger); }
  .perm.rewind ul { margin: 4px 0 0; padding-left: 18px; font: .9em/1.4 var(--mono); max-height: 160px; overflow: auto; }
  .perm .btns .danger { background: var(--danger); color: var(--on-accent); border-color: var(--danger); }
  .note.reverted::before { content: "↺ "; color: var(--accent); }
  .composer:focus-within { border-color: var(--openidea-focus-ring, var(--accent)); }
  .ctxrow { display: flex; align-items: center; gap: 6px; padding: 6px 8px 0; flex-wrap: wrap; }
  .ctx { display: inline-flex; align-items: center; gap: 4px; font: .85em var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 0 2px 0 6px; max-width: 100%; }
  .ctx.off { opacity: .45; text-decoration: line-through; }
  .ctx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx button { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 3px; }
  textarea {
    display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg);
    font: inherit; padding: 6px 8px; min-height: 38px; max-height: 40vh;
  }
  textarea::placeholder { color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 6px; padding: 0 6px 6px; }
  select { font: inherit; font-size: .88em; color: var(--fg); background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; max-width: 42%; }
  .controls .spacer { flex: 1; }
  .send { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 5px; width: 28px; height: 26px; cursor: pointer; display: grid; place-items: center; }
  .send:disabled { opacity: .4; cursor: default; }
  .send.stop { background: var(--danger); }
  select.agent { border-color: var(--warning); color: var(--warning); }

  /* Chat history */
  .history { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px; }
  .history[hidden] { display: none; }
  .history .hhead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .history .hhead b { color: var(--strong); flex: 1; }
  .history input { width: 100%; font: inherit; color: var(--fg); background: var(--input); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; margin-bottom: 6px; }
  .history input:focus { outline: none; border-color: var(--openidea-focus-ring, var(--accent)); }
  .history .list { flex: 1; overflow-y: auto; }
  .history .chat { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
  .history .chat:hover { background: var(--hover); }
  .history .chat.cur { border-color: var(--border); }
  .history .chat .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history .chat.cur .t::before { content: "● "; color: var(--accent); }
  .history .chat .when { flex: none; font-size: .85em; color: var(--muted); }
  .history .chat .del { visibility: hidden; flex: none; }
  .history .chat:hover .del { visibility: visible; }
  .history .chat .del:hover { color: var(--danger); }
  .history .none { color: var(--muted); text-align: center; margin-top: 20px; }
  body.show-history #log, body.show-history .status, body.show-memory #log, body.show-memory .status { display: none; }
  /* Rules & memory */
  .memory .msec { font-size: .8em; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 4px; }
  .memory .msec:first-child { margin-top: 0; }
  .memory .chat { align-items: baseline; }
  .memory .chat .p { flex: none; font-family: var(--mono); color: var(--link); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memory .chat .t { color: var(--muted); }
  .memory .hint { font-size: .85em; color: var(--muted); margin: 2px 6px 6px; }
  .memory .add { border: 1px solid var(--border); border-radius: 6px; padding: 6px; background: var(--bg2); }
  .memory .add textarea { border: 1px solid var(--border); border-radius: 4px; background: var(--input); min-height: 54px; max-height: 30vh; resize: vertical; }
  .memory .add .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .memory .add select { max-width: none; flex: 1; min-width: 0; }
  .memory .add button, .memory .mk { border: 1px solid var(--accent); border-radius: 5px; padding: 2px 10px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
  .memory .add button:disabled { opacity: .5; cursor: default; }
  .memory .mk { margin: 2px 6px 6px; }

  /* Instructions (system prompt) editor */
  .instr { margin: 0 8px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); padding: 6px 8px; }
  .instr .head { display: flex; align-items: baseline; gap: 6px; font-weight: 600; color: var(--strong); }
  .instr .hint { font-size: .85em; color: var(--muted); margin: 2px 0 6px; }
  .instr textarea { border: 1px solid var(--border); border-radius: 4px; background: var(--input); min-height: 90px; max-height: 30vh; resize: vertical; }
  .instr .btns { display: flex; gap: 6px; margin-top: 6px; }
  .instr .btns button { border: 1px solid var(--border); border-radius: 5px; padding: 2px 10px; cursor: pointer; background: none; }
  .instr .btns .save { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .foot { font-size: .8em; color: var(--muted); padding: 0 10px 6px; display: flex; justify-content: space-between; gap: 8px; }
  .foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="top">
    <div class="title">
      <svg class="spark" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0l1.6 5.2L15 6.4l-4.3 2.9L12.3 15 8 11.6 3.7 15l1.6-5.7L1 6.4l5.4-1.2z"/></svg>
      Claude
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="histBtn" title="Past chats in this project">History</button>
    <button class="icon-btn" id="memBtn" title="Rules and memory Claude reads (CLAUDE.md files)">Memory</button>
    <button class="icon-btn" id="instrBtn" title="Extra instructions appended to Claude Code's system prompt">Instructions</button>
    <button class="icon-btn" id="newBtn" title="New chat">＋ New</button>
  </div>

  <div class="history" id="history" hidden>
    <div class="hhead"><b>Chats in this project</b><button class="icon-btn" id="histClose" title="Back to the chat (Esc)">✕</button></div>
    <input id="histSearch" type="search" placeholder="Search chats…" spellcheck="false">
    <div class="list" id="histList"></div>
  </div>
  <div class="history memory" id="memory" hidden>
    <div class="hhead"><b>Rules &amp; memory</b><button class="icon-btn" id="memClose" title="Back to the chat (Esc)">✕</button></div>
    <div class="list" id="memList"></div>
  </div>
  <div id="log"></div>
  <div class="status" id="status"></div>

  <div class="instr" id="instr" hidden>
    <div class="head">Instructions</div>
    <div class="hint">Appended to Claude Code's system prompt for every project. Stored with the plugin, not in any project. Applies from your next message.</div>
    <textarea id="instrText" rows="5" spellcheck="false"></textarea>
    <div class="btns">
      <button class="save" id="instrSave">Save</button>
      <button id="instrReset" title="Use ClaudeSurf's built-in instructions">Reset to default</button>
      <button id="instrCancel">Cancel</button>
    </div>
  </div>

  <div class="composer">
    <div class="mentions" id="mentions" role="listbox" hidden></div>
    <div class="ctxrow" id="ctxrow" hidden>
      <span class="ctx" id="ctx" title="Sent with your message as context"><span id="ctxLabel"></span><button id="ctxToggle" title="Don't attach">✕</button></span>
    </div>
    <div class="queue" id="queue" hidden></div>
    <div class="imgrow" id="imgrow" hidden></div>
    <textarea id="input" rows="2" placeholder="Ask Claude anything — / for commands, @ to mention a file, paste an image"></textarea>
    <input type="file" id="imgFile" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    <div class="controls">
      <button class="icon-btn img-btn" id="imgBtn" title="Attach images (or paste / drop them here)" aria-label="Attach images">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
          <circle cx="5.5" cy="6" r="1.3"/>
          <path d="M1.8 12.2l4-4 3 3 2-2 3.4 3.4"/>
        </svg>
      </button>
      <select id="mode" title="What Claude may do. Each panel starts in your last mode other than Agent; Agent is chosen here, each time.">
        <option value="plan">Chat — read-only</option>
        <option value="acceptEdits">Edit — changes files</option>
        <option value="bypassPermissions">Agent — files &amp; commands</option>
        <option value="default">Ask — approve each action</option>
      </select>
      <select id="model" title="Model">
        <option value="">Default model</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
        <option value="haiku">Haiku</option>
      </select>
      <div class="spacer"></div>
      <button class="send" id="send" title="Send (⏎)" disabled>
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 2l5 5-1.1 1.1L8.8 5V14H7.2V5L4.1 8.1 3 7z"/></svg>
      </button>
    </div>
  </div>
  <div class="foot"><span id="footL"></span><span id="footR"></span></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("send"), statusEl = $("status");
  const modeSel = $("mode"), modelSel = $("model");
  const bridge = window.openidea || { postMessage() {}, onMessage() {} };
  const post = (o) => bridge.postMessage(JSON.stringify(o));
  // Must equal PAGE_REV in src/lib.rs.
  const REV = 16;

  let instructions = "";
  let busy = false, polling = false, ctxLabel = null, ctxOn = true, root = "";
  // The plugin's messages reach the panel in every open window: this panel takes
  // the hello that answers its own nonce, then only messages for its project.
  const nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
  let joined = false;
  let current = null;            // { el, text } of the streaming assistant message
  const tools = new Map();       // tool_use id -> status element
  const prompts = new Map();     // permission request id -> card

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  // The picture icon (same drawing as the attach button), in the text colour.
  const IMG_ICON = '<svg class="ico-img" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5.5" cy="6" r="1.3"/><path d="M1.8 12.2l4-4 3 3 2-2 3.4 3.4"/></svg>';
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const scroll = (force) => { if (force || stick) log.scrollTop = log.scrollHeight; };
  let stick = true;
  log.addEventListener("scroll", () => { stick = atBottom(); });

  // ---------- markdown ----------
  const FILE_RE = /^(?:\/|\.{0,2}\/)?[\w@.\-]+(?:\/[\w@.\-]+)*\.[A-Za-z0-9]{1,8}(?::(\d+)(?:-\d+)?)?$/;
  const URL_RE = /^https?:\/\/\S+$/;
  const BARE_URL_RE = /\bhttps?:\/\/[^\s<>"'`]+/g;
  // A bare URL without trailing punctuation (a ")" stays when the URL opened one).
  function trimUrl(u) {
    let tail = "";
    for (;;) {
      const last = u.slice(-1);
      if (/[.,;:!?'"*_\]}]/.test(last) || (last === ")" && (u.match(/\(/g) || []).length < (u.match(/\)/g) || []).length)) {
        tail = last + tail; u = u.slice(0, -1);
      } else return [u, tail];
    }
  }
  const link = (url, html) => `<a href="${esc(url)}" class="web-link" title="${esc(url)}">${html}</a>`;
  const emphasis = (h) => h
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  function inline(s) {
    // Code spans and links first, as finished HTML protected from the other rules.
    const held = [];
    const hold = (html) => { held.push(html); return "\u0000" + (held.length - 1) + "\u0000"; };
    s = s.replace(/`([^`\n]+)`/g, (_, c) => {
      if (URL_RE.test(c)) return hold(link(c, `<code>${esc(c)}</code>`));
      if (FILE_RE.test(c) && c.includes(".")) return hold(`<code class="file-link" data-path="${esc(c)}">${esc(c)}</code>`);
      return hold(`<code>${esc(c)}</code>`);
    });
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+(?:\([^\s)]*\)[^\s)]*)*)\)/g, (_, t, u) => hold(link(u, emphasis(esc(t)))));
    s = s.replace(/<(https?:\/\/[^\s>]+)>/g, (_, u) => hold(link(u, esc(u))));
    s = s.replace(BARE_URL_RE, (m) => { const [u, tail] = trimUrl(m); return hold(link(u, esc(u))) + tail; });
    s = emphasis(esc(s));
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => held[+i]);
  }
  function markdown(src, streaming) {
    const lines = src.replace(/\r/g, "").split("\n");
    let out = "", i = 0, para = [];
    const flush = () => { if (para.length) { out += "<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"; para = []; } };
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)/);
      if (fence) {
        flush();
        const close = fence[1], lang = fence[2] || "";
        const body = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith(close)) body.push(lines[i++]);
        i++;
        out += `<div class="code"><div class="bar"><span>${esc(lang)}</span><button class="icon-btn copy" title="Copy">Copy</button></div><pre><code>${esc(body.join("\n"))}</code></pre></div>`;
        continue;
      }
      let m;
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { flush(); const n = Math.min(m[1].length, 4); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
      if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { flush(); out += "<hr>"; i++; continue; }
      if (/^\s*>/.test(line)) {
        flush(); const q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
        out += "<blockquote>" + markdown(q.join("\n")) + "</blockquote>"; continue;
      }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-+/.test(lines[i + 1])) {
        flush();
        const row = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const head = row(line); i += 2;
        let t = "<table><tr>" + head.map((h) => `<th>${inline(h)}</th>`).join("") + "</tr>";
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) t += "<tr>" + row(lines[i++]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
        out += t + "</table>"; continue;
      }
      if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
        flush();
        const ordered = /\d/.test(m[2]);
        let items = [];
        while (i < lines.length && (m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
          let item = m[3]; i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += "\n" + lines[i++].trim();
          items.push(item.replace(/^\[( |x)\]\s*/i, (_, x) => (x.trim() ? "☑ " : "☐ ")));
        }
        const tag = ordered ? "ol" : "ul";
        out += `<${tag}>` + items.map((it) => `<li>${inline(it).replace(/\n/g, "<br>")}</li>`).join("") + `</${tag}>`;
        continue;
      }
      if (!line.trim()) { flush(); i++; continue; }
      para.push(line); i++;
    }
    flush();
    return out;
  }

  // ---------- rendering ----------
  function clearEmpty() { const e = log.querySelector(".empty"); if (e) e.remove(); }
  function showEmpty() {
    log.innerHTML = "";
    const e = el("div", "empty", `
      <svg class="spark" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0l1.6 5.2L15 6.4l-4.3 2.9L12.3 15 8 11.6 3.7 15l1.6-5.7L1 6.4l5.4-1.2z"/></svg>
      <h2>Ask Claude</h2>
      <div>Claude Code works in this project with the file you have open as context. Type @ to mention a file.</div>`);
    const s = el("div", "suggest");
    ["Explain the open file", "Find possible bugs in my selection", "Write tests for the open file", "Summarize this project's structure"].forEach((t) => {
      const b = el("button", null, esc(t));
      b.onclick = () => { input.value = t; update(); input.focus(); };
      s.appendChild(b);
    });
    e.appendChild(s);
    log.appendChild(e);
  }
  function addUser(text, context, mentioned, uuid, images) {
    clearEmpty(); endText();
    const m = el("div", "msg user");
    if (uuid) {
      const b = el("button", "icon-btn revert", "↺ Revert");
      b.title = "Restore the files Claude changed since this message (edits made with Claude's file tools; not shell commands)";
      b.dataset.uuid = uuid;
      m.appendChild(b);
    }
    if (context) m.appendChild(el("div", "chip", "📎 " + esc(context)));
    if (Array.isArray(mentioned) && mentioned.length) {
      const row = el("div");
      mentioned.forEach((l) => row.appendChild(el("span", "chip at", "@ " + esc(l))));
      m.appendChild(row);
    }
    if (Array.isArray(images) && images.length) {
      const row = el("div", "thumbs");
      images.forEach((src) => {
        if (typeof src === "string" && /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src)) {
          const img = el("img"); img.src = src; img.alt = "image"; row.appendChild(img);
        } else row.appendChild(el("span", "gone", IMG_ICON + " image"));
      });
      m.appendChild(row);
    }
    m.appendChild(document.createTextNode(text));
    log.appendChild(m);
    scroll(true);
  }
  function textDelta(t) {
    clearEmpty();
    if (!current) { current = { el: el("div", "msg assistant"), text: "" }; log.appendChild(current.el); }
    current.text += t;
    renderCurrent(true);
  }
  let raf = 0;
  function renderCurrent(streaming) {
    if (!current) return;
    if (streaming) {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; if (current) { current.el.innerHTML = markdown(current.text, true); current.el.classList.toggle("cursor", busy); scroll(); } });
    } else {
      current.el.innerHTML = markdown(current.text, false);
      current.el.classList.remove("cursor");
    }
  }
  function endText() { if (current) { renderCurrent(false); current = null; } }
  function addTool(ev) {
    clearEmpty(); endText();
    const d = el("details", "tool" + (ev.sub ? " sub" : ""));
    const s = el("summary");
    const st = el("span", "st run", "◌");
    s.appendChild(st);
    s.appendChild(el("span", "name", esc(ev.name)));
    const ttl = el("span", "ttl", esc(ev.title || ""));
    if (ev.path) { ttl.classList.add("file-link"); ttl.dataset.path = ev.path; ttl.title = "Open " + ev.path; }
    s.appendChild(ttl);
    d.appendChild(s);
    if (ev.detail) {
      const pre = el("pre");
      pre.innerHTML = String(ev.detail).split("\n").map((l) =>
        l.startsWith("+ ") ? `<span class="add">${esc(l)}</span>` : l.startsWith("- ") ? `<span class="del">${esc(l)}</span>` : esc(l)).join("\n");
      d.appendChild(pre);
      if (ev.name === "Edit" || ev.name === "MultiEdit" || ev.name === "TodoWrite") d.open = true;
    }
    if (ev.id) tools.set(ev.id, { st, d });
    log.appendChild(d);
    scroll();
  }
  function toolResult(ev) {
    const t = tools.get(ev.id);
    if (!t) return;
    t.st.className = "st " + (ev.error ? "err" : "ok");
    t.st.textContent = ev.error ? "✕" : "✓";
    if (ev.t && (ev.error || !t.d.querySelector("pre"))) {
      const pre = el("pre"); pre.textContent = ev.t; t.d.appendChild(pre);
      if (ev.error) t.d.open = true;
    }
  }
  const diffHtml = (detail) => String(detail).split("\n").map((l) =>
    l.startsWith("+ ") ? `<span class="add">${esc(l)}</span>` : l.startsWith("- ") ? `<span class="del">${esc(l)}</span>` : esc(l)).join("\n");
  function addPrompt(ev) {
    if (prompts.has(ev.id)) return;
    clearEmpty(); endText();
    const c = el("div", "perm");
    c.innerHTML = `<div class="head"><span>Allow</span><b>${esc(ev.name)}</b><span class="ttl">${esc(ev.title || "")}</span></div>`;
    if (ev.path) { const t = c.querySelector(".ttl"); t.classList.add("file-link"); t.dataset.path = ev.path; }
    if (typeof ev.reason === "string" && ev.reason) c.appendChild(el("div", "why", esc(ev.reason)));
    if (ev.detail && ev.detail !== ev.title) c.appendChild(el("pre", null, diffHtml(ev.detail)));
    const btns = el("div", "btns");
    const choice = (label, cls, decision, title) => {
      const b = el("button", cls, esc(label));
      if (title) b.title = title;
      b.onclick = () => { btns.querySelectorAll("button").forEach((x) => (x.disabled = true)); post({ op: "permission", id: ev.id, decision }); };
      btns.appendChild(b);
    };
    choice("Allow", "allow", "allow");
    if (ev.session) {
      choice("Allow for this chat", "session", "session", "Don't ask again for this until the chat restarts");
      choice("Always allow", "always", "always", "Don't ask again in this project (saved to .claude/settings.local.json, not committed)");
    }
    choice("Deny", "deny", "deny");
    c.appendChild(btns);
    prompts.set(ev.id, c);
    log.appendChild(c);
    post({ op: "seen", id: ev.id });
    setStatus("Waiting for your approval");
    scroll(true);
    btns.querySelector(".allow").focus({ preventScroll: true });
  }
  function addQuestion(ev) {
    if (prompts.has(ev.id)) return;
    const qs = Array.isArray(ev.questions) ? ev.questions : [];
    clearEmpty(); endText();
    const c = el("div", "perm ask");
    c.appendChild(el("div", "head", `<b>Claude has ${qs.length > 1 ? "some questions" : "a question"}</b>`));
    const picks = qs.map(() => new Set());
    const others = [];
    const btns = el("div", "btns");
    const submit = el("button", "allow", "Submit");
    const ready = () => qs.every((q, i) => picks[i].size || others[i].value.trim());
    const refresh = () => { submit.disabled = !ready(); };
    qs.forEach((q, i) => {
      const box = el("div", "q");
      box.appendChild(el("div", "qtext", (q.header ? `<span class="tag">${esc(q.header)}</span>` : "") + esc(q.question)));
      if (q.multiSelect) box.appendChild(el("div", "why", "Choose any that apply"));
      const opts = el("div", "opts");
      const mark = () => opts.querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", picks[i].has(x.dataset.label)));
      (q.options || []).forEach((o) => {
        const b = el("button", "opt", `<span class="lbl">${esc(o.label)}</span>` + (o.description ? `<span class="desc">${esc(o.description)}</span>` : ""));
        b.type = "button";
        b.dataset.label = o.label;
        b.onclick = () => {
          if (q.multiSelect) { if (picks[i].has(o.label)) picks[i].delete(o.label); else picks[i].add(o.label); }
          else { picks[i].clear(); picks[i].add(o.label); others[i].value = ""; }
          mark(); refresh();
        };
        opts.appendChild(b);
      });
      box.appendChild(opts);
      const other = el("input", "other");
      other.placeholder = q.multiSelect ? "Other (added to your choices)…" : "Other…";
      other.maxLength = 2000;
      other.oninput = () => { if (!q.multiSelect && other.value.trim()) { picks[i].clear(); mark(); } refresh(); };
      other.onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing && ready()) { e.preventDefault(); submit.click(); } };
      others.push(other);
      box.appendChild(other);
      c.appendChild(box);
    });
    const lock = () => { c.querySelectorAll("button, input").forEach((x) => (x.disabled = true)); };
    submit.onclick = () => {
      const answers = {};
      qs.forEach((q, i) => {
        const list = [...picks[i]];
        const o = others[i].value.trim();
        if (o) list.push(o);
        answers[q.question] = q.multiSelect ? list : (list[0] || "");
      });
      lock();
      post({ op: "answer", id: ev.id, answers });
    };
    const skip = el("button", "deny", "Skip");
    skip.title = "Don't answer; Claude carries on without your choice";
    skip.onclick = () => { lock(); post({ op: "permission", id: ev.id, decision: "deny" }); };
    btns.append(submit, skip);
    c.appendChild(btns);
    refresh();
    prompts.set(ev.id, c);
    log.appendChild(c);
    post({ op: "seen", id: ev.id });
    setStatus("Waiting for your answer");
    scroll(true);
    const first = c.querySelector(".opt") || c.querySelector(".other");
    if (first) first.focus({ preventScroll: true });
  }
  function promptDone(ev) {
    let c = prompts.get(ev.id);
    if (ev.question) {
      if (!c) {
        if (!ev.answers && !ev.name) return;
        clearEmpty(); endText();
        c = el("div", "perm ask", `<div class="head"><b>Claude asked</b></div>`);
        log.appendChild(c);
      }
      prompts.delete(ev.id);
      c.classList.add("answered");
      Object.entries(ev.answers || {}).forEach(([q, a]) =>
        c.appendChild(el("div", "qa", `<span class="qq">${esc(q)}</span> → <b>${esc(a)}</b>`)));
      c.querySelector(".head").appendChild(el("span", "res " + (ev.t === "Answered" ? "ok" : "no"), esc(ev.t || "")));
      if (!prompts.size && busy) setStatus("Working");
      scroll();
      return;
    }
    if (!c) {
      // Replayed chat, or a prompt this page never saw.
      if (!ev.name) return;
      clearEmpty(); endText();
      c = el("div", "perm", `<div class="head"><span>Allow</span><b>${esc(ev.name)}</b><span class="ttl">${esc(ev.title || "")}</span></div>`);
      log.appendChild(c);
    }
    prompts.delete(ev.id);
    c.classList.add("answered");
    const ok = /^Allowed/.test(ev.t || "");
    c.querySelector(".head").appendChild(el("span", "res " + (ok ? "ok" : "no"), esc(ev.t || "")));
    if (!prompts.size && busy) setStatus("Working");
    scroll();
  }
  function note(text, cls, extra) {
    clearEmpty(); endText();
    const n = el("div", "note" + (cls ? " " + cls : ""));
    n.textContent = text;
    if (extra) n.appendChild(extra);
    log.appendChild(n);
    scroll();
  }
  function done(ev) {
    endText();
    tools.forEach((t) => { if (t.st.classList.contains("run")) { t.st.className = "st"; t.st.textContent = "·"; } });
    if (ev.error) note(typeof ev.t === "string" ? ev.t : "The turn ended with an error.", "error");
    if (ev.denials && ev.denials.length) {
      const names = [...new Set(ev.denials)].join(", ");
      const btn = el("button", null, "Switch to Agent mode");
      btn.onclick = () => { modeSel.value = "bypassPermissions"; modeChanged(); btn.disabled = true; input.focus(); };
      note(`Not allowed in this mode: ${names}.`, "warn", modeSel.value === "bypassPermissions" ? null : btn);
    }
    const parts = [];
    if (typeof ev.cost === "number") parts.push("$" + ev.cost.toFixed(ev.cost < 0.1 ? 4 : 2));
    if (typeof ev.ms === "number") parts.push((ev.ms / 1000).toFixed(1) + "s");
    if (typeof ev.turns === "number") parts.push(ev.turns + (ev.turns === 1 ? " turn" : " turns"));
    if (parts.length) $("footR").textContent = parts.join(" · ");
  }
  function apply(ev, replay) {
    switch (ev.k) {
      case "user": addUser(ev.t, ev.context, ev.mentions, ev.uuid, ev.images); break;
      case "rewind": if (!replay) rewindResult(ev); break;
      case "reverted": note(ev.t || "Files restored.", "reverted"); break;
      case "init":
        if (ev.model) $("footL").textContent = ev.model;
        if (!replay && Array.isArray(ev.commands) && ev.commands.length) commandNames = ev.commands.filter((c) => typeof c === "string");
        break;
      case "text": textDelta(ev.t || ""); break;
      case "block_end": endText(); break;
      case "tool": addTool(ev); break;
      case "tool_result": toolResult(ev); break;
      case "permission": if (!replay) addPrompt(ev); break;
      case "question": if (!replay) addQuestion(ev); break;
      case "permission_done": promptDone(ev); break;
      case "status": if (!replay) setStatus(ev.t); break;
      case "done": if (!replay) turnOk = !ev.error; done(ev); break;
      case "error": if (!replay) turnOk = false; note(ev.t, "error"); break;
      case "log": note(ev.t); break;
    }
  }

  // ---------- state ----------
  function setStatus(t) {
    statusEl.innerHTML = t ? `<span class="dots">${esc(t)}</span>` : "";
  }
  const PLACEHOLDER = input.placeholder;
  function setBusy(b) {
    const was = busy;
    busy = b;
    document.body.classList.toggle("busy", b);
    input.placeholder = b ? "Claude is working — ⏎ queues your next message, Esc stops" : PLACEHOLDER;
    if (b) { if (!statusEl.textContent) setStatus("Working"); startPolling(); }
    else {
      setStatus(""); endText();
      prompts.forEach((_, id) => promptDone({ id, t: "Not answered" }));
      // A revert that ended without an answer (stopped, or Claude Code exited).
      reverting.forEach((finish) => finish("Not confirmed — check the files", false));
      reverting.clear();
      if (was) turnEnded();
    }
    update();
  }
  const STOP_SVG = '<svg width="12" height="12" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/></svg>';
  const SEND_SVG = '<svg width="14" height="14" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2l5 5-1.1 1.1L8.8 5V14H7.2V5L4.1 8.1 3 7z"/></svg>';
  let sendState = "";
  // The send button: Send, Queue (while Claude works and there's something to send), or Stop.
  function update() {
    const content = !!(input.value.trim() || attached.length);
    const state = busy ? (content ? "queue" : "stop") : "send";
    sendBtn.disabled = state === "send" && !content;
    if (state === sendState) return;
    sendState = state;
    sendBtn.classList.toggle("stop", state === "stop");
    sendBtn.title = state === "stop" ? "Stop (Esc)" : state === "queue" ? "Queue — sent when Claude finishes (⏎)" : "Send (⏎)";
    sendBtn.innerHTML = state === "stop" ? STOP_SVG : SEND_SVG;
  }
  function setContext(label) {
    ctxLabel = label || null;
    $("ctxrow").hidden = !ctxLabel;

    const sel = el("select");
    [["CLAUDE.md", "This project, for everyone (CLAUDE.md)"],
     ["CLAUDE.local.md", "This project, just me (CLAUDE.local.md)"],
     ["~/.claude/CLAUDE.md", "All my projects (~/.claude/CLAUDE.md)"]].forEach(([v, l]) => sel.add(new Option(l, v)));
    sel.value = memTarget;
    const go = el("button", null, "Ask Claude to add it");
    const refresh = () => { go.disabled = !ta.value.trim(); memDraft = ta.value; memTarget = sel.value; };
    ta.oninput = refresh; sel.onchange = refresh;
    go.onclick = () => {
      const what = ta.value.trim();
      if (!what) return;
      const file = sel.value;
      const extra = file === "CLAUDE.local.md" ? " If it's a git repository, make sure CLAUDE.local.md is in .gitignore." : "";
      memDraft = "";
      showMemory(false);
      sendText(`Add this instruction to ${file} (create the file if it doesn't exist). Keep what's already there, put it under a fitting heading, and keep it short:${extra}\n\n${what}`);
    };
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go.click(); } if (e.key === "Escape") showMemory(false); };
    const r = el("div", "row"); r.append(sel, go);
    add.append(ta, r);
    if (modeSel.value === "plan") add.appendChild(el("div", "hint", "You're in Chat mode, which is read-only: switch to Edit so Claude can change the file."));
    memList.appendChild(add);
    refresh();
  }

  // Shows a chat's saved transcript in the log.
  function loadTranscript(transcript) {
    log.innerHTML = ""; tools.clear(); prompts.clear(); picked.clear(); current = null; $("footR").textContent = "";
    if (transcript && transcript.length) { transcript.forEach((e) => apply(e, true)); endText(); scroll(true); }
    else showEmpty();
  }

  // ---------- messages from the plugin ----------
  bridge.onMessage((raw) => {
    let m; try { m = JSON.parse(raw); } catch { return; }
    if (m.k === "hello") { if (m.nonce !== nonce) return; joined = true; }
    else if (!joined || (typeof m.root === "string" && m.root !== root)) return;
    switch (m.k) {
      case "hello":
        root = m.root || "";
        log.innerHTML = ""; tools.clear(); prompts.clear(); current = null;
        // The plugin never starts a panel in Agent mode.
        modeSel.value = m.mode && m.mode !== "bypassPermissions" ? m.mode : "acceptEdits";
        modeChanged();
        if (m.model) {
          if (![...modelSel.options].some((o) => o.value === m.model)) modelSel.add(new Option(m.model, m.model));
          modelSel.value = m.model;
        }
        ctxOn = m.includeContext !== false;
        setContext(m.context);
        if (Array.isArray(m.commands)) commandNames = m.commands.filter((c) => typeof c === "string");
        if (m.commandInfo && typeof m.commandInfo === "object") commandInfo = m.commandInfo;
        loadTranscript(m.transcript);
        (m.prompts || []).forEach((e) => apply(e, false));
        setBusy(!!m.busy);
        break;
      case "events":
        polling = false;
        (m.events || []).forEach((e) => apply(e, false));
        if (m.busy !== busy) setBusy(!!m.busy);
        else if (m.busy) startPolling();
        if (!m.busy) setStatus("");
        break;
      case "stale":
        // The component is newer than this page: load the new page.
        setTimeout(() => location.reload(), 1500);
        break;
      case "reset":
        // Queued messages belonged to the chat that was open.
        queue.length = 0; renderQueue();
        loadTranscript([]); setBusy(false);
        if (hist.hidden) input.focus();
        break;
      case "load":
        queue.length = 0; renderQueue();
        loadTranscript(m.transcript); setBusy(false); showHistory(false);
        break;
      case "chats":
        chats = Array.isArray(m.items) ? m.items : [];
        if (!hist.hidden) renderHistory();
        break;
      case "memory":
        if (!mem.hidden) renderMemory(m);
        break;
      case "context":
        setContext(m.context);
        break;
      case "instructions":
        instructions = typeof m.text === "string" ? m.text : "";
        $("instrText").value = instructions;
        $("instr").hidden = true;
        break;
      case "focus":
        if (m.context) { ctxOn = true; setContext(m.context); }
        input.focus();
        break;
      case "mentions":
        if (!mOpen || mSlash || m.seq !== mSeq) break;
        mItems = Array.isArray(m.items) ? m.items : [];
        mSel = 0;
        renderPicker();
        break;
    }
  });

  // ---------- UI events ----------
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + "px"; }
  input.addEventListener("input", () => { autosize(); update(); checkMention(); });
  input.addEventListener("click", checkMention);
  input.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== input) closePicker(); }, 100));
  input.addEventListener("keydown", (e) => {
    if (mOpen && !e.isComposing) {
      if (e.key === "Escape") { e.preventDefault(); closePicker(); return; }
      if (mItems.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        e.preventDefault();
        mSel = (mSel + (e.key === "ArrowDown" ? 1 : mItems.length - 1)) % mItems.length;
        renderPicker();
        return;
      }
      if (mItems.length && (e.key === "Enter" || e.key === "Tab") && !e.shiftKey) { e.preventDefault(); choose(mSel); return; }
    }
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") && !e.shiftKey) setTimeout(checkMention, 0);
    // Backspace in an empty box removes the last attached image.
    if (e.key === "Backspace" && !input.value && attached.length) { e.preventDefault(); attached.pop(); renderImages(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (input.value.trim() || attached.length) send(); }
    if (e.key === "Escape" && busy) stop();
  });
  input.addEventListener("focus", () => post({ op: "context" }));
  sendBtn.onclick = send;
  $("newBtn").onclick = () => {
    if (!busy || confirm((queue.length ? "Queued messages will be dropped. " : "") + "Stop Claude and start a new chat?")) { showHistory(false); showMemory(false, true); post({ op: "new" }); }
  };
  $("histBtn").onclick = () => showHistory(hist.hidden);
  $("memBtn").onclick = () => showMemory(mem.hidden);
  $("memClose").onclick = () => showMemory(false);
  mem.addEventListener("keydown", (e) => { if (e.key === "Escape") showMemory(false); });
  $("histClose").onclick = () => showHistory(false);
  histSearch.addEventListener("input", renderHistory);
  histSearch.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); showHistory(false); }
    if (e.key === "Enter") { const first = histList.querySelector(".chat"); if (first) first.click(); }
  });
  function modeChanged() {
    const agent = modeSel.value === "bypassPermissions";
    modeSel.classList.toggle("agent", agent);
  }
  modeSel.addEventListener("change", modeChanged);
  $("instrBtn").onclick = () => {
    const box = $("instr");
    box.hidden = !box.hidden;
    if (!box.hidden) { $("instrText").value = instructions; $("instrText").focus(); }
  };
  $("instrSave").onclick = () => post({ op: "instructions", text: $("instrText").value });
  $("instrReset").onclick = () => post({ op: "instructions", reset: true });
  $("instrCancel").onclick = () => { $("instrText").value = instructions; $("instr").hidden = true; };
  $("ctxToggle").onclick = () => { ctxOn = !ctxOn; setContext(ctxLabel); };
  log.addEventListener("click", (e) => {
    const rev = e.target.closest(".revert");
    if (rev) { e.preventDefault(); askRewind(rev.dataset.uuid); return; }
    const web = e.target.closest("a[href]");
    if (web) {
      // The frame can't open pages itself; the IDE opens them in the browser.
      e.preventDefault();
      const url = web.getAttribute("href");
      if (/^https?:\/\//i.test(url)) post({ op: "url", url });
      return;
    }
    const link = e.target.closest(".file-link");
    if (link) {
      e.preventDefault();
      const [p, line] = link.dataset.path.split(":");
      const abs = p.startsWith("/") || !root ? p : root.replace(/\/$/, "") + "/" + p.replace(/^\.\//, "");
      post({ op: "open", path: abs, line: line ? Math.max(0, parseInt(line, 10) - 1) : 0 });
      return;
    }
    const copy = e.target.closest(".copy");
    if (copy) {
      const code = copy.closest(".code").querySelector("code").textContent;
      const done = () => { copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1200); };
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(done, () => { post({ op: "copy", text: code }); done(); });
    }
  });

  showEmpty();
  post({ op: "hello", nonce });
})();
</script>
</body>
</html>
